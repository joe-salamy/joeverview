# joeverview bindings — install path (sourced from ~/.tmux.conf by install.sh).
# Edit here for the install path, then `prefix r` (or reopen tmux).
# TPM path (joeverview.tmux) repeats the same two commands with direct
# "$CURRENT_DIR/bin/..." paths: tmux 3.4 display-popup passes shell-command
# to job_run unexpanded (only -d/-T go through format_single), so #{@option}
# indirection cannot work — keep both definitions in sync.
# prefix o: 2x2 snapshot grid (script owns the canvas: -B, no tmux border).
bind-key o display-popup -B -E -w 100% -h 100% "~/.local/bin/tmux-window-picker"
# prefix /: scrollback content search (overrides stock describe-key; prefix ? still lists keys).
bind-key / display-popup -E -w 100% -h 100% -T " Search " "~/.local/bin/tmux-content-search"
# Sticky bell red for prefix o: tmux never sets window_bell_flag on the window
# you are on, but alert-bell fires for every window. Marks @jv_bell; only a
# prefix-o jump to that window clears it. Indexed so user alert-bell hooks
# survive and re-sourcing stays idempotent.
set-hook -g 'alert-bell[86]' 'set-option -wq @jv_bell 1'
# prefix o auto-refresh period in seconds (decimals ok, 0 = off; unset = 1).
# Read when the popup opens. TPM path: set it before `run tpm` instead.
set -g @joeverview-refresh 0.5
