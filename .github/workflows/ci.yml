name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux, fzf, shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux fzf shellcheck
      - name: Shellcheck
        run: shellcheck -S warning bin/* install.sh uninstall.sh joeverview.tmux tests/*.sh
      - name: Install joeverview
        run: ./install.sh
      - name: Smoke test
        run: SMOKE_CHECK_LINKS=1 ./tests/smoke.sh
