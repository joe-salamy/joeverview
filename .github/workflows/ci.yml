name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and fzf
        run: sudo apt-get update && sudo apt-get install -y tmux fzf
      - name: Install joeverview
        run: ./install.sh
      - name: Smoke test
        run: ./tests/smoke.sh
